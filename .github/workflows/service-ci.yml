name: Service CI

on:
  pull_request:
  push:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loan-service-tests:
    name: Loan Service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests -q
        working-directory: loan-service

  payments-api-tests:
    name: Payments API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests -q
        working-directory: payments-api

  gateway-contract-check:
    name: API Gateway contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests -q
        working-directory: api-gateway
