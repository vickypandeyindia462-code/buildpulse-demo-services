name: Service CI

on:
  pull_request:
  push:
    branches: [main, release/**, codex/**, demo/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-tests:
    name: ${{ matrix.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Loan Service, path: loan-service}
          - {name: Payments API, path: payments-api}
          - {name: API Gateway, path: api-gateway}
          - {name: Identity Service, path: identity-service}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r ../requirements.txt
        working-directory: ${{ matrix.path }}
      - run: python -m pytest tests -q
        working-directory: ${{ matrix.path }}

  metadata-validation:
    name: Repository metadata validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml==6.0.2
      - run: python scripts/validate_demo.py
